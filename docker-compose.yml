services:
  postgres:
    image: postgres:16-alpine
    container_name: rook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rook
      POSTGRES_PASSWORD: rook_dev_password
      POSTGRES_DB: rook_money
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
